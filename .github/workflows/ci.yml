name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Commit to check (defaults to the triggering ref)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Reusable release checks must not cancel checks for another release tag.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_ref && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test release artifact collection
        run: node --test .github/scripts/collect-release-artifacts.test.mjs

      - name: Type-check and build
        run: npm run build

  rust:
    name: Rust format and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets for Tauri
        run: npm run build

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
