[package]
name = "ageha"
version = "0.5.2"
description = "Markdown Editor"
authors = ["you"]
edition = "2024"

# 設定項目と定義の詳細は https://doc.rust-lang.org/cargo/reference/manifest.html を参照。

[lib]
# ライブラリ名と実行ファイル名の衝突を避けるため、`_lib` 接尾辞を付ける。
# Windows 固有とみられる問題の詳細は https://github.com/rust-lang/cargo/issues/8519 を参照。
name = "ageha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
anyhow = "1.0"
base64 = "0.22"
dirs = "5.0"
once_cell = "1.20.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-store = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
same-file = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = 'abort'
